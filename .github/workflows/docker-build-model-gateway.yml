name: Docker Build and Push sgl-model-gateway

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '构建分支名称'
        required: true
        type: string
        default: 'develop'
      image_tag:
        description: '镜像标签 (如: v1.0.0, latest, prod-20241207)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: crpi-pweus896l7j9p1b9.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: sgl-project/sgl-model-gateway
  DOCKERFILE_PATH: ./docker/gateway.Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 显示构建配置
      run: |
        echo "🚀 sgl-model-gateway Docker构建任务"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📁 构建分支: ${{ github.event.inputs.branch }}"
        echo "🏷️ 镜像标签: ${{ github.event.inputs.image_tag }}"
        echo "📦 目标仓库: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "🐳 Dockerfile: ${{ env.DOCKERFILE_PATH }}"
        echo "📤 自动推送到阿里云镜像仓库"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: 检出指定分支代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: 验证Dockerfile存在
      run: |
        echo "🔍 验证Dockerfile..."
        if [ ! -f "${{ env.DOCKERFILE_PATH }}" ]; then
          echo "❌ 错误: 在分支 '${{ github.event.inputs.branch }}' 中未找到Dockerfile"
          echo ""
          echo "期望路径: ${{ env.DOCKERFILE_PATH }}"
          echo ""
          echo "当前分支中的文件结构:"
          find . -name "*Dockerfile*" -type f 2>/dev/null | head -5 || echo "  未找到任何Dockerfile文件"
          echo ""
          echo "建议:"
          echo "1. 确认分支中包含Dockerfile"
          echo "2. 或者在workflow中修改DOCKERFILE_PATH环境变量"
          exit 1
        fi
        echo "✅ Dockerfile验证通过"

    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: latest

    - name: 登录阿里云容器镜像服务
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled

    - name: 生成镜像标签
      id: generate-tag
      run: |
        # 获取分支和用户输入的标签
        BRANCH="${{ github.event.inputs.branch }}"
        USER_TAG="${{ github.event.inputs.image_tag }}"

        # 清理分支名用于标签 (移除特殊字符)
        CLEAN_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')

        # 简单标签策略: 有输入用输入的，没有用分支名
        if [ -z "$USER_TAG" ] || [ "$USER_TAG" = "latest" ]; then
          FINAL_TAG="$CLEAN_BRANCH"
        else
          FINAL_TAG="$USER_TAG"
        fi

        echo "final_tag=$FINAL_TAG" >> $GITHUB_OUTPUT
        echo "🏷️ 标签决策:"
        echo "   输入标签: [${USER_TAG:-空}]"
        echo "   最终标签: $FINAL_TAG"

    - name: 构建Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ env.DOCKERFILE_PATH }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.generate-tag.outputs.final_tag }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          BUILD_VERSION=${{ steps.generate-tag.outputs.final_tag }}
          BUILD_BRANCH=${{ github.event.inputs.branch }}
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        labels: |
          org.opencontainers.image.source=https://github.com/sgl-project/sglang
          org.opencontainers.image.description=sgl-model-gateway Docker image
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 显示镜像构建完成信息
      run: |
        echo ""
        echo "🎉 sgl-model-gateway镜像构建并推送完成！"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 镜像已成功推送到阿里云:"
        echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.generate-tag.outputs.final_tag }}"
        echo ""
        echo "🔗 阿里云控制台地址:"
        echo "   https://cr.console.aliyun.com/cn-hangzhou/instances/images"

        echo ""
        echo "📋 构建摘要:"
        echo "   🔀 分支: ${{ github.event.inputs.branch }}"
        echo "   🏷️ 用户输入: ${{ github.event.inputs.image_tag }}"
        echo "   🎯 最终标签: ${{ steps.generate-tag.outputs.final_tag }}"
        echo "   🌍 平台: linux/amd64"
        echo "   📤 状态: 已推送到阿里云"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
